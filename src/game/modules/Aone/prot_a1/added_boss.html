<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C64 Combat Simulator - Boss Update</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #game-container {
            width: 100%;
            max-width: 600px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #console-log {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #222;
            padding: 10px;
            background-color: #050505;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            background-color: #4a148c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #7b1fa2;
        }
        button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        .reverse { background-color: #e0e0e0; color: #000; padding: 0 2px; }
        .yellow { color: #fbc02d; }
        .green { color: #4caf50; }
        .purple { color: #e040fb; }
        .white { color: #ffffff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="console-log"></div>
    <div class="controls">
        <button id="action-btn" onclick="gestisciInputGioco()">Inizia Battaglia</button>
    </div>
</div>
<script>

const logElement = document.getElementById('console-log');
const buttonElement = document.getElementById('action-btn');

// --- VARIABILI GLOBALI (Stato del Gioco) ---
let at = 94; // Capacità di usare le armi / Attacco giocatore
let rf = 10; // Robustezza (HP) giocatore
let de = 12; // Destrezza giocatore (Introdotta nella routine Boss)
let xf = 1;
let sm = 10;
let y = 1; // Turno della mischia standard

// Nemici Standard
let nm = 0;
let am = 0;
let nm_str = "";
let a_str = "0";

// Variabili Boss (Routine 16230)
let ha = 0; // Attacco del boss
let hp = 0; // Parata del boss
let hr = 0; // Robustezza (HP) del boss
let hz = 0; // Robustezza iniziale del boss (per calcolo difficoltà)
let hd = 0; // Destrezza del boss
let pa = 0; // Abilità di parata del giocatore contro il boss

// Variabili di controllo di supporto non valorizzate nello snippet (impostate a valori di default sicuri)
let hs = 0; // Sorpresa (0 = no, 1 = boss sorpreso)
let la_str = ""; // Tipo di arma/locazione (es. "D...", "G...", "V...", "L...")
let ks = 0; // Modificatore danno (usato nella riga 16520)

// Stati della Macchina a Stati del Gioco
// 0: Non iniziato | 1: Mischia Standard | 2: Mostri morti, attesa inizio Boss | 3: Combattimento Boss | 4: Fine
let statoGioco = 0;

function printLog(text) {
    const line = document.createElement('div');
    let formatted = text
        .replace(/\{rvon\}(.*?)\{rvof\}/g, '<span class="reverse">\$1</span>')
        .replace(/\{yel\}/g, '<span class="yellow">')
        .replace(/\{grn\}/g, '<span class="green">')
        .replace(/\{wht\}/g, '<span class="white">')
        .replace(/\{pur\}/g, '<span class="purple">')
        .replace(/\{end\}/g, '</span>');

    line.innerHTML = formatted;
    logElement.appendChild(line);
    logElement.scrollTop = logElement.scrollHeight;
}

const rndInt = (max) => Math.floor(Math.random() * max);

// Gestore unico del click sul bottone
function gestisciInputGioco() {
    if (statoGioco === 0) {
        // Primo click: avvia nemici standard
        generaStatisticheMostri();
        generaTipoMostro();
        statoGioco = 1;
        buttonElement.innerText = "Prossimo Turno";
        eseguiTurnoMischia();
    } else if (statoGioco === 1) {
        // Click durante la mischia standard
        eseguiTurnoMischia();
    } else if (statoGioco === 2) {
        // Click per far apparire il boss
        inizializzaBoss();
        statoGioco = 3;
        buttonElement.innerText = "Sferra un Colpo!";
    } else if (statoGioco === 3) {
        // Click durante i round del boss
        eseguiRoundBoss();
    }
}

// --- FASE 1: NEMICI STANDARD ---
function generaStatisticheMostri() {
    let x = 0;
    let xy = 1;
    sm = 10;
    if (at <= 100) {
        x = 2;
        xy = 1;
    } else if (at > 100 && at < 150) {
        x = 2;
        xy = 1.2;
    } else if (at > 150) {
        x = 4;
        xy = 2;
    } else if (at > 200) {
        x = 6;
        xy = 3.5;
    }
    nm = rndInt(x) + 3;
    am = Math.floor((rndInt(41 - nm) + 21) * xy);
    if (am > 95) am = 95;
}

function generaTipoMostro() {
    a_str = "0";
    let x = rndInt(12) + 1;
    switch (x) {
        case 1:
            nm_str = " Elfi ";
            a_str = "1";
            break;
        case 2:
            nm_str = " Uomini Uccello ";
            a_str = "1";
            break;
        case 3:
            nm_str = " Droll ";
            break;
        case 4:
            nm_str = " Pentauri ";
            a_str = "1";
            break;
        case 5:
            nm_str = " Orchi cattivi ";
            break;
        case 6:
            nm_str = " Uomini Lupo ";
            a_str = "1";
            break;
        case 7:
            nm_str = " Serpenti alati ";
            break;
        case 8:
            nm_str = " Ragni pelosi ";
            break;
        case 9:
            nm_str = " Orchi ";
            break;
        case 10:
            nm_str = " Gnomi ";
            a_str = "1";
            break;
        case 11:
            nm_str = " Nani giganti ";
            a_str = "1";
            break;
        default:
            nm_str = " Zombi ";
            break;
    }
}

function eseguiTurnoMischia() {
    printLog(`{rvon}      Turno di mischia n. ${y}       {rvof}`);
    if (nm === 1) printLog("<br>Sei in mischia con un solo avversario<br>");
    else printLog(`<br>Sei in mischia con ${nm} avversari<br>`);

    // Attacco dei mostri standard
    for (let j = 1; j <= nm; j++) {
        let pa_m = nm >= 4 ? Math.floor(at / 4) : Math.floor(at / nm) + 10;
        let cs = 0;
        xf = 1;
        let cm = rndInt(100) + 1;
        let pp = rndInt(100) + 1;

        if (am < cm) {
            if (nm === 1) printLog(`{yel}*{wht} L' avversario sbaglia il colpo{end}{end}`);
            else printLog(`{yel}*{wht} Il mostro n. ${j} sbaglia il colpo{end}{end}`);
            continue;
        }
        if (am >= cm && pa_m < pp) cs = 1;
        if (Math.floor(am / 20) >= cm) xf = 2;

        if (cs === 1) {
            printLog(`* Il mostro n. ${j} ti fa {rvon}${xf} ferita/e{rvof}`);
            rf -= xf;
            continue;
        }
        if (nm === 1) printLog(`{grn}*{wht} Parato il colpo dell' avversario{end}{end}`);
        else printLog(`{grn}*{wht} Parato colpo del mostro n. ${j}{end}{end}`);
    }

    // Tuo attacco contro la mischia standard
    let cc = nm > 1 ? Math.floor(at / 15) : 0;
    let ap = rndInt(100) + 1;
    if (at < ap) {
        printLog("<br>Hai mancato il tuo colpo");
    } else {
        let xs = rndInt(100) + 1;
        if (at >= ap && sm >= xs) {
            printLog("<br>L'avversario ha scansato il tuo colpo");
        } else {
            let ts = (at >= ap) ? 1 : 0;
            if (ts === 1 && cc >= ap) {
                printLog(`<br>^^ Hai ucciso {rvon}due{rvof} avversari`);
                nm -= 2;
            } else if (nm === 1 && ts === 1 && cc < ap) {
                printLog(`<br>^ Hai ucciso l'ultimo avversario`);
                nm -= 1;
            } else if (ts === 1 && cc < ap) {
                printLog(`<br>^ Hai ucciso un avversario`);
                nm -= 1;
            }
        }
    }

    if (rf <= 0) {
        printLog("<br>{rvon}Sei morto !{rvof}");
        concludiGioco("Fine Partita");
        return;
    }

    if (nm <= 0) {
        printLog("<br>Hai ucciso tutti i tuoi avversari!");
        printLog("Sei cresciuto del 3% di capacità di usare le armi!");
        at += 3;
        printLog("<br>========================================");
        printLog("{pur}UN ENORME BOSS APPARE DALL'OMBRA!{end}");
        printLog("========================================<br>");

        // Passa alla transizione boss
        statoGioco = 2;
        buttonElement.innerText = "Inizia Scontro Boss";
        return;
    }

    if (nm > 1) printLog(`Gli avversari sono ora: ${nm}`);
    if (nm === 1) printLog("Hai di fronte un solo avversario");
    printLog("<br>----------------------------------------<br>");
    y++;
}

// --- FASE 2: COMBATTIMENTO CON IL BOSS (Routine 16230) ---
function inizializzaBoss() {
    if (hs !== 0) {
        ha = 10;
        hp = ha;
        hr = 13;
        printLog("<br>Il tuo avversario e' sorpreso");
    } else {
        ha = at - rndInt(20) + 1;
        pa = at;
        if (la_str.startsWith("D")) ha = 95;
        if (ha > 95) ha = 95;

        hp = ha - 15;
        // Simulazione 2d6 + 6 per la Destrezza del Boss (hd)
        hd = (rndInt(6) + 1) + (rndInt(6) + 1) + 6;

        if(at > 99) hp = hp - (at - 100);
        if (hp < 5) hp = 5;
        // Simulazione dadi per Robustezza del Boss (hr)
        hr = (rndInt(6) + 1) + (rndInt(6) + 1) + 6;
        hz = hr;
        if (pa > 95) pa = 95;
        if (la_str.startsWith("G")) {
            hr += 10;
            hd -= 5;
            hp = 5;
        }
    }
    printLog( `<br> La tua Destrezza e ' ${de}`);
        printLog(`Quella del tuo avversario ${hd} <br> `);
    }

    function eseguiRoundBoss() {
        printLog("{rvon}          Nuovo Round di Scambio         {rvof}");
        // Controllo iniziativa (Chi attacca per primo?)
        if (hd > de) {
            printLog("Lui attacca per primo!");
                bossAttacca();
                if (rf > 0 && hr > 0) giocatoreAttacca(); // Se sopravvivi, contrattacchi
            }
            else {
                printLog("Attacchi per primo!");
                    giocatoreAttacca();
                    if (hr > 0 && rf > 0) bossAttacca(); // Se il boss sopravvive, contrattacca
                }
                // Controlli di fine round
                if (rf <= 0) {
                    printLog(" {yel}Sei morto!{wht}");
                        concludiGioco("Sei Caduto");
                        return;
                    }
                    if (hr <= 0) {
                        printLog("Con questo combattimento sei cresciuto del 5 % in attacco!");
                            at += 5; printLog("{grn}VITTORIA TOTALE! Il dungeon è salvo.{end}"); concludiGioco("Vittoria!");
                            return;
                        }
                        // Effetti e controlli di fine turno del Boss
                        if (hr < Math.floor(hz / 3) && hr > 0) {
                            printLog("L'avversario si trova in difficolta'");
                            hp = 0;
                        }
                        if (la_str.startsWith("V")) printLog("(Esecuzione subroutine 16940)");
                        if (la_str.startsWith("L")) printLog("(Esecuzione subroutine 17060)");
                        if (hs === 1) {
                            ha += 10;
                            hp = ha;
                        }
                        printLog(`La tua robustezza attuale: ${rf} | Vita Boss: ${hr}`);
                        printLog("<br>----------------------------------------<br>");
                        }

                        function giocatoreAttacca() {
                            let aa = rndInt(100) + 1;
                            if (aa > 95 || aa > at) {
                                printLog("hai sbagliato il tuo colpo");
                                return;
                            }
                            printLog("Hai colpito il tuo avversario");
                            let hh = rndInt(5) + 3 + 5 * ks;
                            let d8 = rndInt(100) + 1;
                            if (d8 <= 95 && hp > 0 && d8 < hp) {
                                printLog("ma lui ha parato il tuo colpo");
                                hp -= 5;
                                return;
                            }
                            // Colpo a fondo (Critico)
                            if (aa < Math.floor(at / 10)) {
                                printLog("e gli hai fatto un colpo a fondo,");
                                let hu = hh + 7;
                                printLog(`con una ferita da ${hu} punti`);
                                hr -= hu;
                            } else {
                                printLog(`e gli hai fatto una ferita da ${hh} punti`);
                                hr -= hh;
                            }
                            if (hr <= 0) {
                                printLog("Con questo colpo lo hai ucciso");
                            }
                        }

                        function bossAttacca() {
                            let hm = rndInt(100) + 1;
                            if (hm > 95 || hm > ha) {
                                printLog("l'avversario ha sbagliato il colpo");
                                return;
                            }
                            printLog("l'avversario ti ha colpito");
                            let h8 = rndInt(100) + 1;
                            let hy = rndInt(4) + 3;
                            if (h8 <= pa) {
                                printLog("ma lo hai parato");
                                return;
                            }
                            // Colpo critico del boss
                            if (hm <= Math.floor(ha / 20)) {
                                hy = hy + hy + 1;
                            }
                            printLog(`e ti ha fatto una ferita da ${hy} punti`);
                            rf -= hy;
                        }

                        function concludiGioco(testoBottone) {
                            buttonElement.disabled = true;
                            buttonElement.innerText = testoBottone;
                        }
</script>
