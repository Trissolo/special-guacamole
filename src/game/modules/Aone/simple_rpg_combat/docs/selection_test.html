<!DOCTYPE html>
<html>
<style>
textarea {
  max-height: 130px;
  max-width: 500px;
}

</style>
<body>

<textarea name="textarea" rows="5" cols="15">Write something here</textarea>

<pre id ="result"></pre>

<button id="btn" type="button">Select</button>

<script>
const btn = document.getElementById("btn");
function listener(e)
{
  const sel = document.getSelection();
  console.log(sel);
  document.getElementById("result").innerHTML = sel;// .getRangeAt(0);
}
btn.addEventListener('click', listener);
</script>

</body>
</html>
